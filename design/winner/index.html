<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Kombat — пять финалов</title><link rel="stylesheet" href="gallery.css">
<body><header><a href="../../">MOVIE KOMBAT</a><span>ЭКРАН ПОБЕДИТЕЛЯ · 5 КОНЦЕПЦИЙ</span><nav><a href="#premiere">01</a><a href="#arena">02</a><a href="#deco">03</a><a href="#credits">04</a><a href="#champion">05</a></nav></header><main id="gallery"></main>
<script>
const designs=[['premiere','Премьера','Prata · торжественная киноафиша'],['arena','Финальный раунд','Oswald · титры боевика'],['deco','Большой экран','Prata · ар-деко и кинопремьера'],['credits','После титров','Oswald · сдержанный киноплакат'],['champion','Чемпион','Prata · тёмная арена']];
document.getElementById('gallery').innerHTML=designs.map(([id,name,description],i)=>`<section id="${id}" class="concept ${id}"><div class="caption"><b>0${i+1} / ${name}</b><span>${description}</span></div><article class="stage"><div class="rule top"><span>MOVIE KOMBAT</span><span>ДВА СПИСКА. ОДИН ФИЛЬМ.</span></div><div class="ambient"></div><div class="composition"><div class="poster"><img src="https://image.tmdb.org/t/p/w500/rwopfpHqPCYBSgBuZwkaXXqHp14.jpg" alt="Постер фильма Зверопой"><div class="seal"><span>✦</span> ПОБЕДИТЕЛЬ <span>✦</span></div></div><div class="info"><p class="eyebrow">БИТВА ЗАВЕРШЕНА</p><p class="watch">Сегодня смотрим</p><h1>ЗВЕРОПОЙ</h1><p class="meta">2016 <i></i> Анимация</p><div class="actions"><button>Реванш</button><button>На главную</button></div><p class="note">Фильм выбран. Время устраиваться поудобнее.</p></div></div><div class="rule bottom"><span>ВЕЧЕР НАЧИНАЕТСЯ</span><span>✦</span><span>ПРИЯТНОГО ПРОСМОТРА</span></div></article></section>`).join('');
</script></body></html>
