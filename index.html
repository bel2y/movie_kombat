<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOVIE KOMBAT</title>
  <link rel="stylesheet" href="src/styles.css">
  <script>
window.addEventListener('error', function(event) {
 var status = document.getElementById('startup-status');
 if (status) status.textContent = 'Ошибка запуска: ' + (event.message || 'не удалось загрузить файлы приложения');
}, true);
setTimeout(function() {
 var status = document.getElementById('startup-status');
 if (status && status.textContent.indexOf('Ошибка') !== 0) status.textContent = 'Загрузка задерживается. Проверьте подключение к интернету и повторите запуск.';
}, 15000);
</script><script defer src="src/battle.js"></script>
  <script defer src="src/movies.js"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <button class="brand" data-action="home" aria-label="На главную"><img class="brand-logo" src="src/logo-concept.png" alt="Movie Kombat"></button>
      <nav aria-label="Меню">
        <button data-action="home">Арена</button><button data-action="lists">Списки</button><button data-action="history">История</button>
      </nav>
      <button class="sound" data-action="sound" aria-pressed="false">Звук вкл.</button>
    </header>
    <main><p id="startup-status" role="status" style="color:white;padding:40px;font:20px sans-serif">Загружаем Movie Kombat…</p></main>
    <footer><span><kbd>↑ ↓ ← →</kbd> Навигация</span><span><kbd>OK</kbd> Выбрать</span><span><kbd>Back</kbd> Назад</span></footer>
  </div>
</body>
</html>
